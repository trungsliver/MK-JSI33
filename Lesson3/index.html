<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 3</title>
    <!-- Liên kết css -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="container">
        <h1>Firestore Demo</h1>
        <p class="subtitle">Thêm và hiển thị ghi chú real time</p>

        <form id="note-form" class="card">
            <label for="note-input">Nội dung ghi chú</label>
            <div class="row">
                <input id="note-input" type="text" placeholder="Input here...">
                <button type="submit">Thêm</button>
            </div>
        </form>

        <section class="card">
            <h2>Danh sách ghi chú</h2>
            <ul id="notes-list"></ul>
            <p id="empty-state">Chưa có ghi chú nào.</p>
        </section>
    </main>
    
    <!-- Liên kết js -->
    <script type="module" src="./js/script.js"></script>
</body>
</html>
